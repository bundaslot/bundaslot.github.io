			.container {

			/* Header & Logo */

			@keyframes floatLogo {

				50% { transform: translateY(-8px); }
			}

			/* Teks Running (Typing Effect) */
			.welcome { margin: 15px 0; }
			.welcome h1 {
				font-size: 14px;
				color: #ff5858;
				text-align: center;
				font-family: 'Courier New', monospace;
				white-space: nowrap;
				overflow: hidden;
				border-right: 2px solid #ffffff;
				margin: 0 auto;
				width: fit-content;
				animation: typing 4s steps(30, end) infinite, blink 0.7s infinite;
			}
			@keyframes typing { 0%, 90%, 100% { width: 0; } 30%, 60% { width: 100%; } }
			@keyframes blink { 50% { border-color: transparent; } }

			/* Banner Frame */
			.banner-link {
				display: block;
				margin: 10px 0 20px;

				overflow: hidden;

			.banner-link:hover { border-color: #ffffff; transform: scale(1.02); }

			/* Premium Buttons */
			.btn-login, .btn-daftar {

				font-weight: 800;
				text-decoration: none;
				text-align: center;
				margin-bottom: 15px;
				border-radius: 12px;
				text-transform: uppercase;
				transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
				position: relative;
				overflow: hidden;
				border: 1px solid rgba(255,255,255,0.3);
			}

			.btn-login {
				background: linear-gradient(180deg, #333 0%, #000 100%);
				color: #ffffff;
				border: 1px solid #ba1b1b;
			}

			.btn-daftar {
				background: linear-gradient(180deg, #ba1b1b 0%, #020002 50%, #ba1b1b 100%);
				color: #ffffff;
				box-shadow: 0 5px 15px #ba1b1b;
				animation: pulseGlow 2s infinite;
			}

			@keyframes pulseGlow {
				0% { box-shadow: 0 0 5px #ba1b1b; }
				50% { box-shadow: 0 0 20px #ba1b1b; }
				100% { box-shadow: 0 0 5px #ba1b1b; }
			}

			/* Glossy Shine Effect */
			.btn-daftar::after {
				content: "";
				position: absolute;
				top: -50%; left: -60%; width: 40%; height: 200%;
				background: rgba(255,255,255,0.4);
				transform: rotate(30deg);
				animation: shine 4s infinite;
			}
			@keyframes shine { 0% { left: -60%; } 15% { left: 120%; } 100% { left: 120%; } }
